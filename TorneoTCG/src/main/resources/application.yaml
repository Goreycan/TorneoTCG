
server:
  port: 0 

springdoc:
  api-docs:
    path: /torneo/api-docs
  packages-to-scan: 
    com.TorneoTCG.TorneoTCG.controller 
  use-management-port: false
  override-with-generic-response: true

spring:
  application:
    name: jugador-service # bloque oficial para Eureka
  flyway:
    enabled: true
    baseline-on-migrate: 'true'
  jpa:
    show-sql: 'true'
  profiles:
    active: dev 

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

---
# Perfil DEV
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    username: root
    url: jdbc:mysql://localhost:3306/db_tcg_jugador_dev?createDatabaseIfNotExist=true
    driverClassName: com.mysql.cj.jdbc.Driver
    password: '' 
  jpa:
    hibernate:
      ddl-auto: none 

---
# (Donde corren los test de JUnit)
spring:
  config:
    activate:
      on-profile: test
  datasource:
    username: root
    url: jdbc:mysql://localhost:3306/db_tcg_jugador_test?createDatabaseIfNotExist=true
    driverClassName: com.mysql.cj.jdbc.Driver
    password: ''
  jpa:
    hibernate:
      ddl-auto: update 

---
# El producto final
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    username: root
    url: jdbc:mysql://localhost:3306/db_tcg_jugador_prod?createDatabaseIfNotExist=true
    driverClassName: com.mysql.cj.jdbc.Driver
    password: ''
  jpa:
    hibernate:
      ddl-auto: none